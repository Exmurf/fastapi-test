services:
  fastapi:
    build: .
    container_name: fastapi-container

    env_file:
      - .env

    environment:
      REDIS_URL: redis://redis:6379/0

    ports:
      - "8000:8000"


    volumes:
      - ./logs:/app/logs

    depends_on:
      - redis

  redis:
    image: redis:8-alpine
    container_name: redis

    ports:
      - "6379:6379"